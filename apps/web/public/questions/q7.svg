<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_q7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent_q7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow_q7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_q7)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />

  <!-- Educational Header Badge -->
  <rect x="50" y="44" width="220" height="36" rx="10" fill="url(#accent_q7)" filter="url(#shadow_q7)" />
  <text x="160" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">BATALHA ANATÔMICA</text>

  <!-- Topic Titles (No spoilers) -->
  <text x="400" y="125" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Relações Anatômicas e Inserções Musculares</text>
  <text x="400" y="152" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Topografia do Cíngulo Escapular e Conexões Esqueléticas</text>

  <!-- Scapular / Axial Connection Schematic -->
  <g transform="translate(130, 170)">
    <!-- Scapula Bone Contour -->
    <path d="M 240 80 L 340 50 L 300 230 L 220 210 Z" fill="#1e293b" fill-opacity="0.8" stroke="#64748b" stroke-width="2" />
    <!-- Spine of the Scapula ridge -->
    <path d="M 280 60 L 255 210" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

    <!-- Vertebral dorsal reference line -->
    <line x1="80" y1="50" x2="480" y2="50" stroke="#475569" stroke-width="3" stroke-dasharray="6,4" />

    <!-- Connecting Muscular Radiations (Target Zone) -->
    <path d="M 120 50 L 270 120 L 240 80 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
    <path d="M 270 120 L 420 50 L 320 60 Z" fill="#818cf8" fill-opacity="0.25" stroke="#818cf8" stroke-width="2" />

    <!-- Convergence Pin Callout -->
    <g transform="translate(270, 120)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.25" />
      <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />

      <!-- Leader Line to Card -->
      <line x1="0" y1="12" x2="60" y2="70" stroke="#38bdf8" stroke-width="2" />

      <rect x="60" y="52" width="200" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow_q7)" />
      <text x="160" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ZONA DE CONEXÃO (A)</text>
    </g>

    <!-- Skeletal Reference Pin -->
    <g transform="translate(100, 180)">
      <circle cx="0" cy="0" r="4" fill="#64748b" />
      <line x1="0" y1="0" x2="40" y2="0" stroke="#64748b" stroke-width="1.5" />
      <text x="50" y="4" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LINHA VERTEBRAL SUPERIOR</text>
    </g>
  </g>

  <!-- Bottom pedagogical note -->
  <text x="400" y="540" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Material didático de apoio • Batalha Anatômica Veterinária</text>
</svg>