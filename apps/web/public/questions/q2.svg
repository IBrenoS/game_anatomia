<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_q2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent_q2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow_q2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_q2)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />

  <!-- Grid Guide Lines -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="60" y1="180" x2="740" y2="180" />
    <line x1="60" y1="300" x2="740" y2="300" />
    <line x1="60" y1="420" x2="740" y2="420" />
  </g>

  <!-- Educational Header Badge -->
  <rect x="50" y="44" width="220" height="36" rx="10" fill="url(#accent_q2)" filter="url(#shadow_q2)" />
  <text x="160" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">BATALHA ANATÔMICA</text>

  <!-- Topic Titles (No spoilers) -->
  <text x="400" y="125" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Miologia da Parede Abdominal</text>
  <text x="400" y="152" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Disposição das Camadas Musculares em Grandes Animais</text>

  <!-- Anatomical Abdominal Trunk Diagram -->
  <g transform="translate(100, 170)">
    <!-- Abdominal Cavity Outline -->
    <path d="M 60 180 Q 140 100 280 110 T 520 120 C 560 160 560 220 530 250 C 420 270 300 275 160 260 C 100 250 70 220 60 180 Z"
          fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="2" />

    <!-- Lateral Muscle Fibers (neutral background textures) -->
    <path d="M 180 130 L 260 240 M 240 130 L 320 240 M 300 130 L 380 240 M 360 130 L 440 240"
          stroke="#334155" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Ventral Floor Band Highlight (Muscle under question) -->
    <path d="M 160 258 C 280 272 400 270 510 250"
          fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#shadow_q2)" />

    <!-- Indicator Callout on Ventral Floor -->
    <g transform="translate(340, 265)">
      <!-- Target Pin -->
      <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />

      <!-- Leader line down to label -->
      <line x1="0" y1="8" x2="0" y2="48" stroke="#38bdf8" stroke-width="2" />
      <polyline points="-8,42 0,50 8,42" fill="none" stroke="#38bdf8" stroke-width="2" />

      <!-- Neutral Callout Card -->
      <rect x="-95" y="52" width="190" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow_q2)" />
      <text x="0" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ESTRUTURA INDICADA (A)</text>
    </g>

    <!-- Reference Marker on Costal Arch (neutral reference) -->
    <g transform="translate(140, 110)">
      <circle cx="0" cy="0" r="4" fill="#64748b" />
      <line x1="0" y1="0" x2="-40" y2="-20" stroke="#64748b" stroke-width="1.5" />
      <rect x="-140" y="-35" width="95" height="24" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="-92" y="-19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ARCO COSTAL</text>
    </g>
  </g>

  <!-- Bottom pedagogical note -->
  <text x="400" y="540" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Material didático de apoio • Batalha Anatômica Veterinária</text>
</svg>