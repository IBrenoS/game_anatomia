<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_q5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent_q5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow_q5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_q5)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />

  <!-- Educational Header Badge -->
  <rect x="50" y="44" width="220" height="36" rx="10" fill="url(#accent_q5)" filter="url(#shadow_q5)" />
  <text x="160" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">BATALHA ANATÔMICA</text>

  <!-- Topic Titles (No spoilers) -->
  <text x="400" y="125" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Miologia do Cíngulo Torácico</text>
  <text x="400" y="152" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Aspecto Ventro-Cranial em Grandes Animais</text>

  <!-- Sternal / Pectoral Region Schematic -->
  <g transform="translate(140, 160)">
    <!-- Thorax / Forelimb Outline -->
    <path d="M 60 120 C 100 80 180 80 240 100 C 280 120 300 180 280 260 C 240 260 200 240 160 230 C 100 220 70 180 60 120 Z"
          fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="2" />

    <!-- Sternum Base Reference Line -->
    <line x1="80" y1="220" x2="260" y2="240" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <text x="70" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ESTERNO</text>

    <!-- Highlighted Muscle Mass (Target Structure) -->
    <path d="M 110 180 C 150 160 210 170 240 210 C 200 230 150 225 110 205 Z"
          fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow_q5)" />

    <!-- Fiber orientation marks -->
    <path d="M 130 185 L 150 215 M 165 178 L 185 218 M 200 185 L 220 220" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Target Indicator Pin -->
    <g transform="translate(180, 140)">
      <circle cx="0" cy="55" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="0" cy="55" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="0" y1="47" x2="60" y2="-10" stroke="#38bdf8" stroke-width="2" />

      <!-- Neutral Callout Box -->
      <rect x="60" y="-30" width="200" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow_q5)" />
      <text x="160" y="-8" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ESTRUTURA INDICADA (A)</text>
    </g>

    <!-- Limb articulation reference marker -->
    <g transform="translate(320, 160)">
      <circle cx="0" cy="0" r="4" fill="#64748b" />
      <line x1="0" y1="0" x2="30" y2="0" stroke="#64748b" stroke-width="1.5" />
      <text x="36" y="4" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ÚMERO (CONEXÃO DISTAL)</text>
    </g>
  </g>

  <!-- Bottom pedagogical note -->
  <text x="400" y="540" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Material didático de apoio • Batalha Anatômica Veterinária</text>
</svg>