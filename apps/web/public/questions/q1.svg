<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_q1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent_q1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glow_q1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow_q1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_q1)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />

  <!-- Grid Guide Lines -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="60" y1="180" x2="740" y2="180" />
    <line x1="60" y1="300" x2="740" y2="300" />
    <line x1="60" y1="420" x2="740" y2="420" />
    <line x1="200" y1="120" x2="200" y2="500" />
    <line x1="400" y1="120" x2="400" y2="500" />
    <line x1="600" y1="120" x2="600" y2="500" />
  </g>

  <!-- Educational Header Badge -->
  <rect x="50" y="44" width="220" height="36" rx="10" fill="url(#accent_q1)" filter="url(#shadow_q1)" />
  <text x="160" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">BATALHA ANATÔMICA</text>

  <!-- Topic Titles (No spoilers) -->
  <text x="400" y="125" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Topografia Anatômica Veterinária</text>
  <text x="400" y="152" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Planos e Eixos de Orientação Espacial em Grandes Animais</text>

  <!-- Quadruped Anatomical Schematic Outline -->
  <g transform="translate(100, 160)">
    <!-- Body silhouette -->
    <path d="M 80 230 C 90 190, 120 150, 160 140 C 220 130, 270 150, 340 150 C 420 150, 480 130, 520 170 C 540 190, 550 240, 540 270 C 510 270, 460 250, 380 255 C 290 260, 220 275, 170 270 C 130 265, 100 250, 80 230 Z"
          fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="2" />

    <!-- Vertebral column curvature line -->
    <path d="M 150 140 Q 260 145 360 150 T 520 170" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,4" opacity="0.8" />

    <!-- Neutral Axis Arrows -->
    <!-- Cranial (Left) -->
    <g transform="translate(40, 200)">
      <line x1="30" y1="0" x2="0" y2="0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow_cranial)" />
      <polygon points="0,0 8,-4 8,4" fill="#94a3b8" />
      <text x="-8" y="4" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">CRANIAL</text>
    </g>

    <!-- Caudal (Right) -->
    <g transform="translate(560, 200)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#94a3b8" stroke-width="2.5" />
      <polygon points="30,0 22,-4 22,4" fill="#94a3b8" />
      <text x="38" y="4" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="start">CAUDAL</text>
    </g>

    <!-- Highlighted Target Callout Indicator (Superior axis under analysis) -->
    <g transform="translate(340, 60)">
      <!-- Pulsing indicator rings -->
      <circle cx="0" cy="80" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="0" cy="80" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />

      <!-- Leader line to badge -->
      <line x1="0" y1="72" x2="0" y2="28" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Neutral Callout Box -->
      <rect x="-85" y="0" width="170" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow_q1)" />
      <text x="0" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ÁREA SOB ANÁLISE</text>
    </g>

    <!-- Ventral lower boundary indicator (neutral reference) -->
    <g transform="translate(340, 290)">
      <circle cx="0" cy="0" r="5" fill="#64748b" />
      <line x1="0" y1="0" x2="0" y2="25" stroke="#64748b" stroke-width="1.5" />
      <rect x="-75" y="25" width="150" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="0" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">EIXO OPOSTO</text>
    </g>
  </g>

  <!-- Bottom pedagogical note -->
  <text x="400" y="540" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Material didático de apoio • Batalha Anatômica Veterinária</text>
</svg>