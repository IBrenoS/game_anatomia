<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />
  
  <!-- Silhouette / anatomical outline -->
  <path d="M 120 380 Q 200 320 280 340 T 440 310 Q 520 290 600 330 T 700 400" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <circle cx="280" cy="340" r="12" fill="#8b5cf6" opacity="0.8" />
  <circle cx="440" cy="310" r="14" fill="#3b82f6" opacity="0.8" />
  <circle cx="600" cy="330" r="12" fill="#8b5cf6" opacity="0.8" />

  <!-- Educational badge -->
  <rect x="50" y="50" width="220" height="38" rx="10" fill="url(#accent)" />
  <text x="160" y="74" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BATALHA ANATÔMICA</text>
  
  <!-- Title & Topic -->
  <text x="400" y="160" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">Regiões Anatômicas: Dorsal vs Ventral</text>
  <text x="400" y="200" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" text-anchor="middle">Dorso (Coluna/Cima) - Ventre (Abdômen/Baixo)</text>
  
  <!-- Central anatomical focus card -->
  <g transform="translate(250, 240)">
    <rect width="300" height="180" rx="16" fill="#090d16" fill-opacity="0.8" stroke="#3b82f6" stroke-width="2" />
    <path d="M 40 90 L 260 90" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />
    <text x="150" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ESTRUTURA EM DESTAQUE</text>
    <rect x="50" y="105" width="200" height="42" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="150" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Região Dorsal</text>
  </g>

  <!-- Bottom metadata -->
  <text x="400" y="520" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Material didático de apoio para identificação de miologia veterinária</text>
</svg>