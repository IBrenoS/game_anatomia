<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_q9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent_q9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow_q9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_q9)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />

  <!-- Educational Header Badge -->
  <rect x="50" y="44" width="220" height="36" rx="10" fill="url(#accent_q9)" filter="url(#shadow_q9)" />
  <text x="160" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">BATALHA ANATÔMICA</text>

  <!-- Topic Titles (No spoilers) -->
  <text x="400" y="125" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Classificação dos Grupos Musculares do Tronco</text>
  <text x="400" y="152" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Avaliação Topográfica em Grandes Animais</text>

  <!-- Dual Focus / Association Diagram -->
  <g transform="translate(120, 170)">
    <!-- Trunk Body Silhouette -->
    <path d="M 60 140 C 90 90 180 80 280 80 C 380 80 460 100 500 150 C 480 220 420 250 320 250 C 200 250 120 240 60 140 Z"
          fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="2" />

    <!-- Landmark 1 (Pectoral Region Focus) -->
    <g transform="translate(140, 210)">
      <circle cx="0" cy="0" r="28" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" filter="url(#shadow_q9)" />
      <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
      <text x="0" y="-35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ESTRUTURA I</text>
    </g>

    <!-- Connecting Axis / Alignment Line -->
    <line x1="170" y1="215" x2="350" y2="235" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6,4" />

    <!-- Landmark 2 (Abdominal Floor Focus) -->
    <g transform="translate(380, 235)">
      <circle cx="0" cy="0" r="28" fill="#818cf8" fill-opacity="0.25" stroke="#818cf8" stroke-width="2" filter="url(#shadow_q9)" />
      <circle cx="0" cy="0" r="7" fill="#6366f1" stroke="#818cf8" stroke-width="2.5" />
      <text x="0" y="-35" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ESTRUTURA II</text>
    </g>

    <!-- Neutral Affirmation Callout Box -->
    <g transform="translate(260, 40)">
      <rect x="-120" y="0" width="240" height="34" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow_q9)" />
      <text x="0" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">EIXO E RELAÇÃO TOPOGRÁFICA</text>
    </g>
  </g>

  <!-- Bottom pedagogical note -->
  <text x="400" y="540" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Material didático de apoio • Batalha Anatômica Veterinária</text>
</svg>