<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_q6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent_q6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow_q6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_q6)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />

  <!-- Educational Header Badge -->
  <rect x="50" y="44" width="220" height="36" rx="10" fill="url(#accent_q6)" filter="url(#shadow_q6)" />
  <text x="160" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">BATALHA ANATÔMICA</text>

  <!-- Topic Titles (No spoilers) -->
  <text x="400" y="125" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Topografia Anatômica Regional</text>
  <text x="400" y="152" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Classificação de Regiões Corporais e Topografia Muscular</text>

  <!-- Body Quadrant / Regional Segmentation Schema -->
  <g transform="translate(130, 170)">
    <!-- Body Silhouette Base -->
    <path d="M 60 170 C 80 120, 140 100, 220 100 C 320 100, 420 110, 480 160 C 500 200, 480 240, 450 250 C 360 260, 240 260, 150 245 C 90 235, 60 200, 60 170 Z"
          fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="2" />

    <!-- Regional Grid Boundaries -->
    <line x1="260" y1="90" x2="260" y2="265" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="60" y1="180" x2="480" y2="180" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Sector Labels (Neutral quadrant markers) -->
    <text x="160" y="145" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SETOR 1</text>
    <text x="360" y="145" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SETOR 2</text>
    <text x="160" y="220" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SETOR 3</text>

    <!-- Highlighted Sector Under Analysis (Ventral Abdomen floor) -->
    <rect x="250" y="185" width="180" height="75" rx="10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow_q6)" />

    <!-- Target Pin -->
    <g transform="translate(340, 220)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.25" />
      <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />

      <!-- Leader Line down to callout card -->
      <line x1="0" y1="12" x2="0" y2="60" stroke="#38bdf8" stroke-width="2" />

      <rect x="-95" y="62" width="190" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow_q6)" />
      <text x="0" y="84" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">REGIÃO SOB ANÁLISE</text>
    </g>
  </g>

  <!-- Bottom pedagogical note -->
  <text x="400" y="540" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Material didático de apoio • Batalha Anatômica Veterinária</text>
</svg>