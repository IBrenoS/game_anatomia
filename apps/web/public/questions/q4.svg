<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_q4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accent_q4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow_q4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg_q4)" rx="24" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" rx="16" />

  <!-- Educational Header Badge -->
  <rect x="50" y="44" width="220" height="36" rx="10" fill="url(#accent_q4)" filter="url(#shadow_q4)" />
  <text x="160" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">BATALHA ANATÔMICA</text>

  <!-- Topic Titles (No spoilers) -->
  <text x="400" y="125" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Biomecânica da Coluna Vertebral</text>
  <text x="400" y="152" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Análise Funcional e Dinâmica dos Grupos Musculares Epaxiais</text>

  <!-- Spinal Column Biomechanical Vector Diagram -->
  <g transform="translate(100, 180)">
    <!-- Vertebral Bridge Schematic (represented as stylized vertebrae segments) -->
    <g stroke="#64748b" stroke-width="2" fill="#1e293b">
      <rect x="80" y="110" width="45" height="40" rx="6" />
      <rect x="140" y="105" width="45" height="40" rx="6" />
      <rect x="200" y="102" width="45" height="40" rx="6" />
      <rect x="260" y="100" width="45" height="40" rx="6" />
      <rect x="320" y="102" width="45" height="40" rx="6" />
      <rect x="380" y="105" width="45" height="40" rx="6" />
      <rect x="440" y="110" width="45" height="40" rx="6" />
    </g>

    <!-- Longitudinal Tension Cable / Epaxial Muscle Vector -->
    <path d="M 60 70 Q 280 40 500 70" fill="none" stroke="#38bdf8" stroke-width="5" filter="url(#shadow_q4)" />

    <!-- Tension force vectors (arrows) -->
    <g stroke="#38bdf8" stroke-width="2.5" fill="#38bdf8">
      <!-- Left vector -->
      <line x1="180" y1="58" x2="120" y2="64" />
      <polygon points="120,64 130,58 128,70" />
      <!-- Right vector -->
      <line x1="380" y1="58" x2="440" y2="64" />
      <polygon points="440,64 430,58 432,70" />
    </g>

    <!-- Support Pillars (Cranial and Pelvic girdles schematic) -->
    <line x1="100" y1="150" x2="80" y2="230" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="460" y1="150" x2="480" y2="230" stroke="#475569" stroke-width="6" stroke-linecap="round" />

    <!-- Neutral Center Indicator -->
    <g transform="translate(280, 20)">
      <circle cx="0" cy="35" r="12" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="0" cy="35" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="28" x2="0" y2="-5" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Neutral Callout Card -->
      <rect x="-95" y="-38" width="190" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow_q4)" />
      <text x="0" y="-17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AÇÃO BIOMECÂNICA</text>
    </g>

    <!-- Axial Reference Line -->
    <text x="280" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">EIXO LONGITUDINAL AXIAL</text>
  </g>

  <!-- Bottom pedagogical note -->
  <text x="400" y="540" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Material didático de apoio • Batalha Anatômica Veterinária</text>
</svg>